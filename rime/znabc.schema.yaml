schema:
  schema_id: znabc
  name: 智能 ABC · 复刻
  version: "0.3.0"
  author:
    - znabc reconstruction project
  description: |
    从原始智能 ABC 样本恢复的拼音、音形和笔形输入。
    空格前数字 1..8 输入形码；空格打开选单后数字 1..9 选字，再按空格确认。
    v 前缀临时英文输入，空格或回车直接提交去掉 v 的字母或数字。
    选单中按 Tab 切换逐字选字，可组合基础词库没有的新词。
    整词候选后附首音节单字，选中后可继续转换剩余编码。
    分段选择后自动打开下一段选单，无需再次空格。
    词编码后加 [ 取首字、加 ] 取末字，支持基础词和用户词。
    i/I 数量词空格直接上屏，v1..v9 空格打开符号选单。
    回车打开 GBK 单字查询，无匹配时提交原码；匹配完整笔形码前缀，方括号翻页。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: znabc_user_dict
    reset: 1
    states: [基础词库, 用户词库]
  - name: znabc_learning
    reset: 1
    states: [冻结学习, 自动学习]

znabc:
  learning:
    min_length: 2
    max_length: 9
    promotion_uses: 3
    temporary_capacity: 2000

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Caps_Lock: clear

engine:
  processors:
    - ascii_composer
    - lua_processor@*znabc_processor
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*znabc_translator
    - punct_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyzI0123456789[]
  initials: abcdefghijklmnopqrstuvwxyzI12345678
  delimiter: "'"
  max_code_length: 48

menu:
  page_size: 9

key_binder:
  bindings:
    - { when: composing, accept: "Control+p", send: Up }
    - { when: composing, accept: "Control+n", send: Down }
    - { when: has_menu, accept: "minus", send: Page_Up }
    - { when: has_menu, accept: "equal", send: Page_Down }

punctuator:
  half_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
  full_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"

recognizer:
  patterns: {}

