schema:
  schema_id: znabc
  name: 智能 ABC · 复原
  version: "0.1.2"
  author:
    - znabc reconstruction project
  description: |
    从原始智能 ABC 样本恢复的拼音、音形和笔形输入。
    空格前数字 1..8 输入形码；空格打开选单后数字 1..9 选字，再按空格确认。
    v 前缀临时英文输入，空格直接提交去掉 v 的字母或数字。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Caps_Lock: clear

engine:
  processors:
    - ascii_composer
    - lua_processor@*znabc_processor
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*znabc_translator
    - punct_translator

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz12345678
  initials: abcdefghijklmnopqrstuvwxyz12345678
  delimiter: "'"
  max_code_length: 48

menu:
  page_size: 9

key_binder:
  bindings:
    - { when: composing, accept: "Control+p", send: Up }
    - { when: composing, accept: "Control+n", send: Down }
    - { when: has_menu, accept: "minus", send: Page_Up }
    - { when: has_menu, accept: "equal", send: Page_Down }

punctuator:
  half_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
  full_shape:
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"

recognizer:
  patterns: {}

